- job_name: mongo
  static_configs:
    - targets:
        - "localhost"
      labels:
        job: mongologs
        __path__: /var/log/mongodb/mongod.log

- job_name: external
  static_configs:
    - targets:
        - localhost
      labels:
        job: externallogs
        __path__: /var/log/external_logs/*.log
  pipeline_stages:
    - regex:
        expression: '.*/(?P<filename>[^/]+\.log)$'
    - labels:
        filename:
